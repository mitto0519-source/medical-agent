# Medical-Agent — 컨테이너 실행 정의
#
# 사용법:
#   docker compose up -d --build      # 빌드 + 백그라운드 실행
#   http://localhost:8501             # 브라우저 접속
#   docker compose logs -f            # 로그 확인
#   docker compose down               # 중지
#
# 핵심 설계:
#   - 의존성/소스는 이미지에 고정 → OneDrive 동기화 무관 (패키지 증발/소스 되돌림 차단)
#   - .env API 키는 env_file로 주입 → admin 전역 키 그대로 동작 (블로그의 -e 방식과 동일)
#   - data/ (2.8GB 원시자료 + RAG + 장기기억)는 볼륨 마운트 → 이미지 밖에서 영속
services:
  medical-agent:
    build: .
    image: medical-agent:latest
    container_name: medical-agent
    ports:
      - "8501:8501"
    env_file:
      - .env                         # ANTHROPIC/OPENAI/GOOGLE 키 (admin 전역)
    volumes:
      - ./data:/app/data             # 원시자료·ChromaDB·agent_self·change_log·working_papers 영속
      - ./.streamlit:/app/.streamlit:ro
      # 개발 반복용 소스 마운트 (활성). 최종 배포 시 주석 처리 후 `docker compose build`로
      # 이미지에 고정하면 OneDrive 동기화에 완전 면역.
      - ./app:/app/app
      - ./src:/app/src
    restart: unless-stopped

  # Heartbeat — 운영 런타임의 정기 작업 단일 진입점.
  # 부팅 시 catchup(task_recover/lifecycle_tick/idempotency_gc/budget_snapshot/trend_learn)
  # + 분단위 polling. 기존 learn_scheduler는 trend_learn job으로 흡수됨.
  # PC가 꺼져 배치를 놓쳐도 컨테이너 뜨면 즉시 last_run 체크 → 지연된 job 실행.
  learner:
    image: medical-agent:latest
    build: .
    container_name: medical-agent-learner
    env_file:
      - .env
    volumes:
      - ./data:/app/data             # 메인 앱과 동일 data 공유 (그래프·RAG·trend_state·runtime DBs)
      - ./src:/app/src
      - ./scripts:/app/scripts
    command: ["python", "-m", "src.runtime.heartbeat"]
    restart: unless-stopped           # PC/Docker 재시작 시 자동 복귀 → 부팅 즉시 catchup
    depends_on:
      - medical-agent
