; Medical-Agent supervisord — Next.js + FastAPI 동시 관리.
; ★ 2026-06-20 v6: HF Space 단일 컨테이너 안에서 두 process 동시.
;   port 3000 (Next.js, 외부 노출)
;   port 8000 (FastAPI, 내부 — Next.js rewrites /fastapi/* → localhost:8000/*)

[supervisord]
nodaemon=true
user=root
logfile=/dev/stdout
logfile_maxbytes=0
pidfile=/var/run/supervisord.pid

[program:fastapi]
command=uvicorn api.main:app --host 127.0.0.1 --port 8000 --workers 1
directory=/app
autostart=true
autorestart=true
startsecs=10
startretries=3
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
environment=PYTHONPATH="/app",PYTHONUNBUFFERED="1"
priority=10

[program:nextjs]
command=node /app/web-runtime/server.js
directory=/app/web-runtime
autostart=true
autorestart=true
startsecs=15
startretries=3
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
environment=PORT="3000",HOSTNAME="0.0.0.0",NEXT_PUBLIC_API_BASE="/fastapi",NODE_ENV="production"
priority=20
