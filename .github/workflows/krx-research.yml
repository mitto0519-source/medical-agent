name: KRX multi-year research

on:
  workflow_dispatch:
  push:
    branches:
      - krx-data-split-20260821
    paths:
      - 'tools/krx_research_pipeline.py'
      - '.github/workflows/krx-research.yml'

permissions:
  contents: read

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install pandas numpy pyarrow scikit-learn lightgbm
      - name: Run research pipeline
        run: python tools/krx_research_pipeline.py
      - name: Upload research outputs
        uses: actions/upload-artifact@v4
        with:
          name: krx-research-2020-2026
          path: output/
          retention-days: 7
