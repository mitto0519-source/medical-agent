name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install anthropic python-dotenv requests flask pytest

      - name: Syntax check
        run: |
          find src app scripts -name "*.py" | xargs python -m py_compile
          echo "Syntax OK"

      - name: Unit tests
        env:
          ANTHROPIC_API_KEY: "dummy-key-for-tests"
          SUPABASE_DB_URL: ""
        run: |
          pytest tests/test_functional_smoke.py -q --tb=short
