name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      ANTHROPIC_API_KEY: dummy-key-for-tests
      SUPABASE_DB_URL: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install anthropic python-dotenv requests flask pytest
      - name: Run tests
        run: pytest tests/test_functional_smoke.py -q --tb=short
